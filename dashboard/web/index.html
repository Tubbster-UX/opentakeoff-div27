<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Brink Design</title>
    <script>
      // Theme before first paint (web/src/design/theme.ts owns it afterwards): the `.dark` class
      // switches the Brink tokens and EasySchematic's dark mode together.
      (function () {
        var m = null;
        try { m = localStorage.getItem("brink:theme"); } catch (e) {}
        var dark = m === "dark" || ((!m || m === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <!-- Includes EasySchematic (AGPL-3.0, github.com/duremovich/EasySchematic), vendored in dashboard/vendor/easyschematic. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
